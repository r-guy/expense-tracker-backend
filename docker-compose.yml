services:
  currency-backend:
    build: .
    image: expense-tracker-currency-backend:latest
    container_name: expense-tracker-currency-backend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${PORT:-8000}:${PORT:-8000}"
    healthcheck:
      test:
        - CMD
        - python
        - "-c"
        - "import os,urllib.request; urllib.request.urlopen('http://127.0.0.1:'+os.getenv('PORT','8000')+'/health', timeout=4)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
